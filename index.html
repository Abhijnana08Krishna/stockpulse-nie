 <!DOCTYPE html>
<html>
<head>
    <title>Stock Pulse Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        header {
            background: #142d4e;
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            margin: 0;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 2px 8px #ddd;
        }

        .card h2 {
            color: #142d4e;
        }

        table {
            width: 100%;
            background: white;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #142d4e;
            color: white;
        }

        .low {
            color: red;
            font-weight: bold;
        }

        .good {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>📦 STOCK PULSE</h1>
    <p>Smart Laboratory Inventory Management</p>
</header>

<div class="cards">

    <div class="card">
        <h2 id="total">3</h2>
        <p>Total Components</p>
    </div>

    <div class="card">
        <h2 id="available">95</h2>
        <p>Total Available Stock</p>
    </div>

    <div class="card">
        <h2 id="lowCount">1</h2>
        <p>Low Stock Items</p>
    </div>

</div>

<h2>Inventory Details</h2>

<table>
    <thead>
        <tr>
            <th>Component</th>
            <th>Available Stock</th>
            <th>Minimum Stock</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="inventory"></tbody>
</table>

<script>

const components = [
    {name: "LED", stock: 15, minimum: 20},
    {name: "Resistor", stock: 50, minimum: 30},
    {name: "Capacitor", stock: 30, minimum: 10}
];

let lowCount = 0;
let totalStock = 0;

const table = document.getElementById("inventory");

components.forEach(item => {

    totalStock += item.stock;

    let status;

    if (item.stock <= item.minimum) {
        status = "LOW STOCK";
        lowCount++;
    } else {
        status = "AVAILABLE";
    }

    table.innerHTML += `
        <tr>
            <td>${item.name}</td>
            <td>${item.stock}</td>
            <td>${item.minimum}</td>
            <td class="${status === 'LOW STOCK' ? 'low' : 'good'}">
                ${status}
            </td>
        </tr>
    `;

});

document.getElementById("total").innerText =
    components.length;

document.getElementById("available").innerText =
    totalStock;

document.getElementById("lowCount").innerText =
    lowCount;

</script>

</body>
</html>
